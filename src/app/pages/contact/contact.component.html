<div class="contact-page">
  <section class="contact-hero">
    <div class="container">
      <p-tag value="Estamos aqui para ti" severity="secondary" [rounded]="true"></p-tag>
      <h1>Cont<span class="highlight">áctanos</span></h1>
      <p>¿Tienes preguntas sobre un pedido, una pieza, o simplemente quieres saludar? Escríbenos.</p>
    </div>
  </section>

  <section class="contact-section">
    <div class="container">
      <div class="contact-grid">

        <p-card styleClass="contact-info">
          <h2>Información de Contacto</h2>
          <div class="info-list">
            <div *ngFor="let info of contactInfo" class="info-item">
              <div class="info-icon"><i [class]="info.icon"></i></div>
              <div>
                <p class="info-label">{{ info.label }}</p>
                <a *ngIf="info.href" [href]="info.href" class="info-value">{{ info.value }}</a>
                <p *ngIf="!info.href" class="info-value">{{ info.value }}</p>
              </div>
            </div>
          </div>

          <!-- Map embed -->
          <div class="map-container">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d240862.87658037023!2d-99.37270379099686!3d19.390519706423507!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85ce0026db097507%3A0x54061076265ee841!2sCiudad%20de%20M%C3%A9xico%2C%20CDMX!5e0!3m2!1ses!2smx!4v1710000000000!5m2!1ses!2smx"
              width="100%"
              height="250"
              style="border:0; border-radius: 12px;"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="Ubicación VintageVibe — Ciudad de México">
            </iframe>
          </div>
        </p-card>

        <p-card styleClass="contact-form-wrapper">
          <h2>Envíanos un mensaje</h2>

          <p-message *ngIf="formStatus() === 'success'" severity="success" styleClass="contact-success">
            Mensaje enviado con exito. Te responderemos en menos de 24 horas.
          </p-message>

          <form *ngIf="formStatus() !== 'success'" class="contact-form" #contactForm="ngForm"
            (ngSubmit)="submitForm(contactForm)">

            <div class="form-group">
              <label for="fullName">Nombre completo *</label>
              <input id="fullName" pInputText type="text" name="fullName" ngModel required
                placeholder="Tu nombre" class="form-input">
            </div>

            <div class="form-group">
              <label for="email">Correo electrónico *</label>
              <input id="email" pInputText type="email" name="email" ngModel required
                placeholder="tu@email.com" class="form-input">
            </div>

            <div class="form-group">
              <label for="subject">Asunto *</label>
              <select id="subject" name="subject" ngModel required class="form-input native-select">
                <option value="">Selecciona un tema</option>
                <option *ngFor="let option of subjectOptions" [value]="option.value">{{ option.label }}</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message">Mensaje *</label>
              <textarea id="message" pTextarea name="message" ngModel required rows="5"
                placeholder="Describe tu consulta con el mayor detalle posible..."
                class="form-input form-textarea"></textarea>
            </div>

            <button pButton type="submit" class="btn-full"
              [label]="formStatus() === 'loading' ? 'Enviando...' : 'Enviar Mensaje'"
              icon="pi pi-send" iconPos="right"
              [disabled]="contactForm.invalid || formStatus() === 'loading'">
            </button>
          </form>
        </p-card>

      </div>
    </div>
  </section>
</div>
